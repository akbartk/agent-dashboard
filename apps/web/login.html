<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor Agen</title>
<script src="/aset/tema.js"></script>
<link rel="stylesheet" href="/aset/app.css">
</head>
<body>
<main class="masuk">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7"/><path d="M7 9h12M7 13h8M7 17h12"/></svg>
    <div><strong>Kantor Agen</strong><span>Dashboard Aktivitas Agen</span></div>
  </div>
  <div class="kartu">
    <h1>Masuk</h1>
    <form method="post" action="/login">
      <div class="isian">
        <label for="akun">Akun</label>
        <input id="akun" name="akun" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{.Akun}}" required>
      </div>
      <div class="isian">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Masuk</button>
      {{if .Pesan}}<p class="pesan" role="alert">{{.Pesan}}</p>{{end}}
    </form>
  </div>
</main>
</body>
</html>
