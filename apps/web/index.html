<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor Agen</title>
<script src="/aset/tema.js"></script>
<link rel="stylesheet" href="/aset/app.css">
<script src="/aset/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7"/><path d="M7 9h12M7 13h8M7 17h12"/></svg>
      <div><strong>Kantor Agen</strong><span>Dashboard Aktivitas Agen</span></div>
    </div>
    <div class="top-right">
      <div id="summary" class="summary" aria-label="Ringkasan"></div>
      <button class="live" id="pause" type="button" data-key="pause" aria-pressed="false" title="Jeda pembaruan tampilan"><i id="liveDot"></i><span id="stamp">—</span><span class="sr-only">, jeda pembaruan tampilan</span></button>
      <button class="icon-btn" id="theme" type="button" aria-label="Ganti ke tema gelap" title="Ganti ke tema gelap">
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="pengguna">
        <span class="me" id="me"></span>
        <form class="keluar" method="post" action="/logout"><button type="submit" class="link">Keluar</button></form>
      </div>
    </div>
  </header>
  <noscript><p class="pesan-js">Halaman ini memerlukan JavaScript.</p></noscript>

  <main class="main">
    <p id="banner" class="banner" role="alert" hidden></p>
    <section class="map" aria-labelledby="h-kantor">
      <div class="sec-head">
        <h2 id="h-kantor">Kantor</h2>
        <span class="legend" aria-hidden="true"><span><i class="k work"></i>bekerja</span><span><i class="k wait"></i>menunggu</span><span><i class="k idle"></i>bebas</span><span id="legend-sibuk" hidden><i class="k busy"></i>sibuk</span><span>Klik agen untuk membuka misinya</span></span>
      </div>
      <div class="map-rooms" id="map"></div>
    </section>

    <div id="alert"></div>

    <div class="board">
      <section class="list" aria-labelledby="h-misi">
        <div class="m-card">
          <div class="sec-head"><h1 id="h-misi">Misi</h1><span id="missionCount"></span></div>
          <div id="missions" class="missions"></div>
        </div>
        <div class="m-card" id="doneCard" hidden></div>
      </section>
      <section class="detail" id="detail" aria-labelledby="h-detail" aria-live="off"></section>
    </div>

    <div class="lower" id="lower">
      <section class="panel" aria-labelledby="h-peristiwa">
        <div class="sec-head"><h2 id="h-peristiwa">Peristiwa terbaru</h2><span id="eventCount"></span></div>
        <div id="events"></div>
      </section>
    </div>
  </main>
</div>
<div class="sr-only" role="status" id="announce"></div>
</body>
</html>
