<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor Agen</title>
<script src="/aset/tema.js"></script>
<link rel="stylesheet" href="/aset/app.css">
</head>
<body>
<main class="masuk">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7"/><path d="M7 9h12M7 13h8M7 17h12"/></svg>
    <div><strong>Kantor Agen</strong><span>Dashboard Aktivitas Agen</span></div>
  </div>
  <div class="kartu">
    <h1>Ganti password</h1>
    <form method="post" action="/ganti-password">
      <div class="isian">
        <label for="password_baru">Password baru</label>
        <input id="password_baru" name="password_baru" type="password" autocomplete="new-password" minlength="12" required>
        <p class="bantu">Minimal 12 karakter.</p>
      </div>
      <div class="isian">
        <label for="password_ulang">Ulangi password baru</label>
        <input id="password_ulang" name="password_ulang" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button type="submit" class="btn">Simpan</button>
      {{if .Pesan}}<p class="pesan" role="alert">{{.Pesan}}</p>{{end}}
    </form>
  </div>
</main>
</body>
</html>
